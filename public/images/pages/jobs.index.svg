<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img">
    <title>Arbeit wird nicht über die Mauer an eine Abteilung gegeben, sondern über mehrere Rollen hinweg übernommen</title>
    <defs>

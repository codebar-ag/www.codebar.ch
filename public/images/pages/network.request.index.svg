<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img">
    <title>Das eigene Netzwerk-Profil wird über einen persönlichen Link selbst gepflegt</title>
    <defs>
        <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#C026D3"/>
            <stop offset="1" stop-color="#2563EB"/>
        </linearGradient>
        <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="1" stop-color="#f4eef8"/>
        </linearGradient>
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="32"/>
        </filter>
        <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1.8" fill="#09090b"/>
        </pattern>

        <path id="w1" d="M0 0c3.5-6 7.5-6 11 0s7.5 6 11 0"/>
        <path id="w2" d="M0 0c3.5-6 7.5-6 11 0s7.5 6 11 0s7.5-6 11 0s7.5 6 11 0"/>
        <path id="w3" d="M0 0c3.5-6 7.5-6 11 0s7.5 6 11 0s7.5-6 11 0s7.5 6 11 0s7.5-6 11 0s7.5 6 11 0"/>
        <path id="w4" d="M0 0c3.5-6 7.5-6 11 0s7.5 6 11 0s7.5-6 11 0s7.5 6 11 0s7.5-6 11 0s7.5 6 11 0s7.5-6 11 0s7.5 6 11 0"/>
    </defs>

    <rect width="1200" height="630" fill="url(#wash)"/>
    <rect width="150" height="630" fill="url(#dots)" opacity="0.1"/>
    <rect x="1050" width="150" height="630" fill="url(#dots)" opacity="0.1"/>

    <ellipse cx="600" cy="315" rx="92" ry="116" fill="url(#accent)" filter="url(#glow)" opacity="0.55"/>

    <g transform="rotate(-4 270 315)">
    <rect x="124" y="228" width="268" height="200" rx="18" fill="#09090b" opacity="0.3"/>
    <rect x="112" y="216" width="268" height="200" rx="18" fill="#ffffff" stroke="#09090b" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="160" cy="266" r="22" fill="none" stroke="#09090b" stroke-width="3"/>
    <g stroke="#09090b" stroke-width="4" fill="none" stroke-linecap="round"><use href="#w2" x="198" y="262"/></g>
    <g stroke="#09090b" stroke-width="4" fill="none" stroke-linecap="round"><use href="#w3" x="140" y="330"/><use href="#w1" x="220" y="330"/><use href="#w2" x="140" y="364"/></g>
    <rect x="358" y="298" width="52" height="44" rx="10" fill="#ffffff" stroke="#09090b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M370 298v-12a14 14 0 0 1 28 0v12" data-detail="lock shackle" stroke="#09090b" stroke-width="3" fill="none" opacity="1"/>

    <g stroke="#09090b" stroke-width="3.5" fill="none" stroke-linecap="round"><use href="#w3" x="796" y="392"/><use href="#w1" x="876" y="392"/></g>
    <rect x="776" y="424" width="120" height="34" rx="17" fill="url(#accent)"/>


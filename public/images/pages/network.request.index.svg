    <rect x="764" y="162" width="388" height="98" rx="16" fill="#09090b" opacity="0.3"/>
    <rect x="752" y="150" width="388" height="98" rx="16" fill="#ffffff" stroke="#09090b" stroke-width="3" stroke-linejoin="round"/>
    <rect x="776" y="182" width="120" height="30" rx="15" fill="url(#accent)"/>
    <g stroke="#09090b" stroke-width="4" fill="none" stroke-linecap="round"><use href="#w3" x="916" y="202"/></g>
    <rect x="764" y="294" width="388" height="194" rx="18" fill="#09090b" opacity="0.3"/>
    <rect x="752" y="282" width="388" height="194" rx="18" fill="#ffffff" stroke="#09090b" stroke-width="3" stroke-linejoin="round"/>
    <rect x="776" y="310" width="340" height="42" rx="10" fill="#ffffff" stroke="#09090b" stroke-width="3"/>
    <g stroke="#09090b" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.45"><use href="#w2" x="796" y="336"/></g>

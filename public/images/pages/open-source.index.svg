<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img">
    <title>Ein Package aus dem eigenen Repository wird öffentlich und andere bauen darauf weiter</title>
    <defs>
        <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#C026D3"/>
            <stop offset="1" stop-color="#2563EB"/>
        </linearGradient>
        <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="1" stop-color="#f4eef8"/>
        </linearGradient>
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="32"/>
        </filter>
        <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1.8" fill="#09090b"/>
        </pattern>

        <path id="w1" d="M0 0c3.5-6 7.5-6 11 0s7.5 6 11 0"/>
        <path id="w2" d="M0 0c3.5-6 7.5-6 11 0s7.5 6 11 0s7.5-6 11 0s7.5 6 11 0"/>
        <path id="w3" d="M0 0c3.5-6 7.5-6 11 0s7.5 6 11 0s7.5-6 11 0s7.5 6 11 0s7.5-6 11 0s7.5 6 11 0"/>
        <path id="w4" d="M0 0c3.5-6 7.5-6 11 0s7.5 6 11 0s7.5-6 11 0s7.5 6 11 0s7.5-6 11 0s7.5 6 11 0s7.5-6 11 0s7.5 6 11 0"/>
    </defs>

    <rect width="1200" height="630" fill="url(#wash)"/>
    <rect width="150" height="630" fill="url(#dots)" opacity="0.1"/>
    <rect x="1050" width="150" height="630" fill="url(#dots)" opacity="0.1"/>

    <ellipse cx="600" cy="315" rx="92" ry="116" fill="url(#accent)" filter="url(#glow)" opacity="0.55"/>

    <g transform="rotate(-4 270 315)">
    <rect x="124" y="188" width="296" height="278" rx="20" fill="#09090b" opacity="0.3"/>
    <rect x="112" y="176" width="296" height="278" rx="20" fill="#ffffff" stroke="#09090b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M112 234h296" data-detail="panel header rule" stroke="#09090b" stroke-width="2.5" fill="none" opacity="0.5"/>
    <circle cx="142" cy="205" r="9" fill="#09090b" opacity="0.25"/>
    <circle cx="168" cy="205" r="9" fill="#09090b" opacity="0.25"/>
    <rect x="148" y="268" width="224" height="140" rx="14" fill="#ffffff" stroke="#09090b" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#09090b" stroke-width="4" fill="none" stroke-linecap="round"><use href="#w3" x="172" y="320"/><use href="#w1" x="252" y="320"/><use href="#w2" x="172" y="354"/></g>
    </g>

    <rect x="1000" y="120" width="148" height="96" rx="14" fill="#ffffff" stroke="#09090b" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#09090b" stroke-width="3.5" fill="none" stroke-linecap="round"><use href="#w2" x="1022" y="164"/><use href="#w1" x="1022" y="190"/></g>
    <path class="connector" d="M1062 300h48V216" stroke="#09090b" stroke-width="3" fill="none" opacity="0.45" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="1062" cy="300" r="9" fill="url(#accent)"/>
    <rect x="772" y="256" width="302" height="190" rx="20" fill="#09090b" opacity="0.3"/>
    <rect x="760" y="244" width="302" height="190" rx="20" fill="#ffffff" stroke="#09090b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M760 302h302" data-detail="panel header rule" stroke="#09090b" stroke-width="2.5" fill="none" opacity="0.5"/>
    <rect x="784" y="260" width="30" height="30" rx="8" fill="url(#accent)"/>
    <g stroke="#09090b" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.45"><use href="#w2" x="830" y="282"/></g>
    <g stroke="#09090b" stroke-width="4" fill="none" stroke-linecap="round"><use href="#w3" x="784" y="340"/><use href="#w2" x="864" y="340"/></g>
    <rect x="784" y="380" width="254" height="14" rx="7" fill="#09090b" opacity="0.12"/>
    <rect x="784" y="380" width="176" height="14" rx="7" fill="url(#accent)"/>

    <g stroke="#09090b" stroke-width="4" fill="none" stroke-linecap="round">
        <path class="arrow" d="M482 315h44"/>
        <path class="arrow" d="M674 315h44"/>
    </g>
    <g fill="#09090b">
        <path d="M534 315l-16-10v20Z"/>
        <path d="M726 315l-16-10v20Z"/>
    </g>

    <rect x="546" y="261" width="108" height="108" rx="22" fill="#ffffff" stroke="#09090b" stroke-width="3" stroke-linejoin="round"/>
    <g class="act" transform="translate(570 285)">
        <g fill="url(#accent)"><circle cx="12" cy="12" r="8"/><circle cx="48" cy="12" r="8"/><circle cx="30" cy="50" r="8"/></g>
        <path d="M12 20v6a10 10 0 0 0 10 10h16a10 10 0 0 0 10-10v-6M30 36v6" stroke="url(#accent)" stroke-width="5" fill="none" stroke-linecap="round"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img">
    <title>Aus einer Anwendung, von der man nur das Fenster sieht, werden die Schichten dahinter: jeder Dienst mit Anbieter und Land</title>
    <defs>
        <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#C026D3"/>
            <stop offset="1" stop-color="#2563EB"/>
        </linearGradient>
        <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="1" stop-color="#f4eef8"/>
        </linearGradient>
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="32"/>
        </filter>
        <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1.8" fill="#09090b"/>
        </pattern>

        <path id="w1" d="M0 0c3.5-6 7.5-6 11 0s7.5 6 11 0"/>
        <path id="w2" d="M0 0c3.5-6 7.5-6 11 0s7.5 6 11 0s7.5-6 11 0s7.5 6 11 0"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img">
    <title>Vier Bereiche, die einzeln herumliegen, werden zu einem Weg von der Idee bis zum Betrieb</title>
    <defs>

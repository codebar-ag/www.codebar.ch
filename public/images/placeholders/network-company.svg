<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 96" role="img" aria-hidden="true">
    <!-- Flat unDraw-style company placeholder: buildings in grays with brand accent -->
    <g>
        <!-- ground line -->
        <rect x="8" y="86" width="144" height="2" rx="1" fill="#e5e7eb"/>

        <!-- back building left -->
        <rect x="22" y="34" width="30" height="52" rx="2" fill="#e5e7eb"/>
        <rect x="27" y="40" width="6" height="6" rx="1" fill="#ffffff"/>
        <rect x="37" y="40" width="6" height="6" rx="1" fill="#ffffff"/>
        <rect x="27" y="50" width="6" height="6" rx="1" fill="#ffffff"/>
        <rect x="37" y="50" width="6" height="6" rx="1" fill="#ffffff"/>
        <rect x="27" y="60" width="6" height="6" rx="1" fill="#ffffff"/>
        <rect x="37" y="60" width="6" height="6" rx="1" fill="#ffffff"/>

        <!-- main building with brand accent -->
        <rect x="58" y="18" width="44" height="68" rx="2" fill="#d1d5db"/>
        <rect x="58" y="18" width="44" height="8" rx="2" fill="#500472"/>
        <rect x="65" y="32" width="8" height="8" rx="1" fill="#ffffff"/>
        <rect x="76" y="32" width="8" height="8" rx="1" fill="#ffffff"/>
        <rect x="87" y="32" width="8" height="8" rx="1" fill="#ffffff"/>
        <rect x="65" y="44" width="8" height="8" rx="1" fill="#ffffff"/>
        <rect x="76" y="44" width="8" height="8" rx="1" fill="#ffffff"/>
        <rect x="87" y="44" width="8" height="8" rx="1" fill="#ffffff"/>
        <rect x="65" y="56" width="8" height="8" rx="1" fill="#ffffff"/>
        <rect x="76" y="56" width="8" height="8" rx="1" fill="#500472" opacity="0.55"/>
        <rect x="87" y="56" width="8" height="8" rx="1" fill="#ffffff"/>
        <!-- door -->
        <rect x="74" y="70" width="12" height="16" rx="1" fill="#500472"/>

        <!-- back building right -->
        <rect x="108" y="44" width="28" height="42" rx="2" fill="#e5e7eb"/>
        <rect x="113" y="50" width="6" height="6" rx="1" fill="#ffffff"/>
        <rect x="123" y="50" width="6" height="6" rx="1" fill="#ffffff"/>
        <rect x="113" y="60" width="6" height="6" rx="1" fill="#ffffff"/>
        <rect x="123" y="60" width="6" height="6" rx="1" fill="#ffffff"/>
        <rect x="113" y="70" width="6" height="6" rx="1" fill="#ffffff"/>
        <rect x="123" y="70" width="6" height="6" rx="1" fill="#ffffff"/>

        <!-- shrub accents -->
        <circle cx="16" cy="82" r="5" fill="#500472" opacity="0.35"/>
        <circle cx="146" cy="83" r="4" fill="#500472" opacity="0.25"/>
    </g>
</svg>

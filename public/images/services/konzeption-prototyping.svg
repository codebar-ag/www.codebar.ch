<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" width="1600" height="840" fill="none" role="img" aria-labelledby="title-prototyping">
    <title id="title-prototyping">Ein skizzierter Screenflow wird zum klickbaren Prototyp auf Desktop und Mobile</title>

    <defs>
        <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#C026D3"/>
            <stop offset="1" stop-color="#2563EB"/>
        </linearGradient>
        <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="1" stop-color="#f4eef8"/>
        </linearGradient>
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="42"/>
        </filter>
        <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1.8" fill="#09090b"/>
        </pattern>

        <path id="w1" d="M0 0c3.5-6 7.5-6 11 0s7.5 6 11 0"/>
        <path id="w2" d="M0 0c3.5-6 7.5-6 11 0s7.5 6 11 0s7.5-6 11 0s7.5 6 11 0"/>
        <path id="w3" d="M0 0c3.5-6 7.5-6 11 0s7.5 6 11 0s7.5-6 11 0s7.5 6 11 0s7.5-6 11 0s7.5 6 11 0"/>
        <path id="w4" d="M0 0c3.5-6 7.5-6 11 0s7.5 6 11 0s7.5-6 11 0s7.5 6 11 0s7.5-6 11 0s7.5 6 11 0s7.5-6 11 0s7.5 6 11 0"/>

        <g id="scrWide">
            <rect x="0" y="0" width="230" height="150" rx="10" fill="#09090b" stroke="none" opacity="0.3" transform="translate(11 11)"/>
            <rect x="0" y="0" width="230" height="150" rx="10" fill="#ffffff" stroke="#09090b" stroke-width="3"/>
            <rect x="14" y="16" width="202" height="18" rx="4" fill="#ffffff" stroke="#09090b" stroke-width="2"/>
            <rect x="14" y="44" width="202" height="56" rx="5" fill="#ffffff" stroke="#09090b" stroke-width="2"/>
            <path d="M14 44l202 56M216 44L14 100" data-detail="placeholder cross" stroke="#09090b" stroke-width="1.8" opacity="0.3"/>
            <g stroke="#09090b" stroke-width="4" stroke-linecap="round" fill="none">
                <use href="#w3" x="14" y="120"/><use href="#w2" x="94" y="120"/>
                <use href="#w2" x="14" y="140"/>
            </g>
        </g>

        <g id="scrTall">
            <rect x="0" y="0" width="150" height="212" rx="10" fill="#09090b" stroke="none" opacity="0.3" transform="translate(11 11)"/>
            <rect x="0" y="0" width="150" height="212" rx="10" fill="#ffffff" stroke="#09090b" stroke-width="3"/>
            <rect x="14" y="16" width="122" height="18" rx="4" fill="#ffffff" stroke="#09090b" stroke-width="2"/>
            <g stroke="#09090b" stroke-width="2" fill="#ffffff">
                <rect x="14" y="46" width="122" height="34" rx="5"/>
                <rect x="14" y="90" width="122" height="34" rx="5"/>
                <rect x="14" y="134" width="122" height="34" rx="5"/>
            </g>
            <g stroke="#09090b" stroke-width="4" stroke-linecap="round" fill="none">
                <use href="#w2" x="26" y="65"/>
                <use href="#w3" x="26" y="109"/>
                <use href="#w2" x="26" y="153"/>
                <use href="#w2" x="14" y="188"/>
            </g>
        </g>

        <g id="scrSmall">
            <rect x="0" y="0" width="164" height="128" rx="10" fill="#09090b" stroke="none" opacity="0.3" transform="translate(11 11)"/>
            <rect x="0" y="0" width="164" height="128" rx="10" fill="#ffffff" stroke="#09090b" stroke-width="3"/>
            <rect x="14" y="16" width="136" height="18" rx="4" fill="#ffffff" stroke="#09090b" stroke-width="2"/>
            <g stroke="#09090b" stroke-width="2" fill="#ffffff">
                <rect x="14" y="44" width="62" height="46" rx="5"/>
                <rect x="88" y="44" width="62" height="46" rx="5"/>
            </g>
            <g stroke="#09090b" stroke-width="4" stroke-linecap="round" fill="none">
                <use href="#w2" x="14" y="110"/><use href="#w1" x="72" y="110"/>
            </g>
        </g>

    </defs>

    <rect width="1600" height="840" fill="url(#wash)"/>
    <rect x="0" y="0" width="300" height="840" fill="url(#dots)" opacity="0.1"/>
    <rect x="1300" y="0" width="300" height="840" fill="url(#dots)" opacity="0.1"/>

    <g transform="rotate(-4 340 375)">
        <g stroke="#09090b" stroke-width="2.5" opacity="0.45" fill="none">
            <path d="M330 385h32v-100h34M330 385h32v152h34" class="connector"/>
        </g>
        <g fill="#09090b" opacity="0.45">
            <circle cx="330" cy="385" r="6"/><circle cx="396" cy="285" r="6"/><circle cx="396" cy="537" r="6"/>
        </g>

        <use href="#scrWide" x="100" y="310"/>
        <use href="#scrTall" x="396" y="179"/>
        <use href="#scrSmall" x="396" y="473"/>
    </g>

    <ellipse cx="780" cy="428" rx="118" ry="146" fill="url(#accent)" filter="url(#glow)" opacity="0.55"/>

    <g stroke="#09090b" stroke-width="4" fill="#09090b">
        <path d="M600 428h72" stroke-linecap="round"/>
        <path d="M690 428l-20-12v24Z" stroke="none"/>
        <path d="M850 428h72" stroke-linecap="round"/>
        <path d="M940 428l-20-12v24Z" stroke="none"/>
    </g>

    <rect x="714" y="374" width="124" height="124" rx="26" fill="#09090b" opacity="0.3"/>
    <rect x="706" y="366" width="124" height="124" rx="26" fill="#ffffff" stroke="#09090b" stroke-width="3"/>
    <path class="act" d="M752 388v58l14-15 11 22 12-6-11-21 20-3Z" fill="url(#accent)"/>

    <rect x="996" y="216" width="460" height="420" rx="18" fill="#09090b" opacity="0.3"/>
    <rect x="974" y="194" width="472" height="432" rx="22" stroke="url(#accent)" stroke-width="3"/>
    <rect x="980" y="200" width="460" height="420" rx="18" fill="#ffffff" stroke="#09090b" stroke-width="3"/>

    <path d="M980 266h460" data-detail="browser chrome rule" stroke="#09090b" stroke-width="3"/>
    <g fill="#09090b" opacity="0.25">
        <circle cx="1012" cy="233" r="8"/><circle cx="1040" cy="233" r="8"/><circle cx="1068" cy="233" r="8"/>
    </g>
    <rect x="1104" y="219" width="240" height="28" rx="14" fill="#09090b" opacity="0.08"/>

    <rect x="1010" y="296" width="400" height="120" rx="12" fill="url(#accent)" opacity="0.14"/>
    <g stroke="#500472" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.65">
        <use href="#w3" x="1042" y="344"/><use href="#w2" x="1122" y="344"/>
        <use href="#w4" x="1042" y="382"/>
    </g>

    <g stroke="#09090b" stroke-width="2.5" stroke-linejoin="round">
        <rect x="1010" y="440" width="120" height="100" rx="10" fill="#ffffff"/>
        <rect x="1150" y="440" width="120" height="100" rx="10" fill="#ffffff"/>
    </g>
    <g stroke="#09090b" stroke-width="4" stroke-linecap="round" fill="none">
        <use href="#w2" x="1030" y="490"/><use href="#w1" x="1030" y="516"/>
        <use href="#w2" x="1170" y="490"/><use href="#w1" x="1170" y="516"/>
    </g>

    <rect x="1010" y="562" width="170" height="50" rx="25" fill="url(#accent)"/>
    <g stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none">
        <use href="#w2" x="1042" y="590"/><use href="#w1" x="1102" y="590"/>
    </g>

    <rect x="1326" y="392" width="152" height="310" rx="26" fill="#09090b" opacity="0.3"/>
    <rect x="1310" y="376" width="152" height="310" rx="26" fill="#ffffff" stroke="#09090b" stroke-width="3"/>
    <rect x="1366" y="390" width="40" height="8" rx="4" fill="#09090b" opacity="0.25"/>
    <rect x="1328" y="416" width="116" height="70" rx="8" fill="url(#accent)" opacity="0.14"/>
    <g stroke="#09090b" stroke-width="4" stroke-linecap="round" fill="none">
        <use href="#w3" x="1328" y="512"/>
        <use href="#w2" x="1328" y="540"/>
    </g>
    <rect x="1328" y="574" width="96" height="34" rx="17" fill="url(#accent)"/>
    <use href="#w2" x="1352" y="592" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
</svg>

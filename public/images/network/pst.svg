<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 96" role="img" aria-hidden="true">
    <!-- Flat drawing: calculator, coin and rising chart — finance & accounting -->
    <g>
        <!-- ground line -->
        <rect x="8" y="86" width="144" height="2" rx="1" fill="#e5e7eb"/>

        <!-- calculator -->
        <rect x="34" y="26" width="40" height="60" rx="4" fill="#d1d5db"/>
        <rect x="40" y="32" width="28" height="12" rx="2" fill="#ffffff"/>
        <rect x="40" y="50" width="8" height="8" rx="2" fill="#ffffff"/>
        <rect x="50" y="50" width="8" height="8" rx="2" fill="#ffffff"/>
        <rect x="60" y="50" width="8" height="8" rx="2" fill="#ffffff"/>
        <rect x="40" y="62" width="8" height="8" rx="2" fill="#ffffff"/>
        <rect x="50" y="62" width="8" height="8" rx="2" fill="#ffffff"/>
        <rect x="60" y="62" width="8" height="8" rx="2" fill="#500472" opacity="0.55"/>
        <rect x="40" y="74" width="18" height="8" rx="2" fill="#ffffff"/>
        <rect x="60" y="74" width="8" height="8" rx="2" fill="#500472"/>

        <!-- rising bar chart -->
        <rect x="88" y="62" width="12" height="24" rx="2" fill="#e5e7eb"/>
        <rect x="104" y="48" width="12" height="38" rx="2" fill="#d1d5db"/>
        <rect x="120" y="34" width="12" height="52" rx="2" fill="#500472" opacity="0.75"/>

        <!-- coin -->
        <circle cx="138" cy="26" r="10" fill="#500472" opacity="0.35"/>
        <rect x="136" y="20" width="4" height="12" rx="2" fill="#ffffff"/>

        <!-- shrub accent -->
        <circle cx="18" cy="82" r="5" fill="#500472" opacity="0.35"/>
    </g>
</svg>

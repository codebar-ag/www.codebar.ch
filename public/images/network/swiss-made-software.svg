<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 96" role="img" aria-hidden="true">
    <!-- Flat drawing: certificate with rosette and cross — Swiss quality label -->
    <g>
        <!-- ground line -->
        <rect x="8" y="86" width="144" height="2" rx="1" fill="#e5e7eb"/>

        <!-- certificate sheet -->
        <rect x="42" y="20" width="58" height="66" rx="3" fill="#e5e7eb"/>
        <rect x="50" y="30" width="42" height="4" rx="2" fill="#ffffff"/>
        <rect x="50" y="40" width="34" height="4" rx="2" fill="#ffffff"/>
        <rect x="50" y="50" width="42" height="4" rx="2" fill="#ffffff"/>
        <rect x="50" y="60" width="26" height="4" rx="2" fill="#ffffff"/>

        <!-- rosette badge -->
        <circle cx="112" cy="56" r="16" fill="#500472" opacity="0.85"/>
        <circle cx="112" cy="56" r="11" fill="#ffffff"/>
        <!-- cross -->
        <rect x="109" y="49" width="6" height="14" rx="1" fill="#500472"/>
        <rect x="105" y="53" width="14" height="6" rx="1" fill="#500472"/>
        <!-- ribbon tails -->
        <path d="M105 70 L101 84 L109 79 L112 86 L114 72 Z" fill="#500472" opacity="0.45"/>

        <!-- shrub accents -->
        <circle cx="18" cy="82" r="5" fill="#500472" opacity="0.35"/>
        <circle cx="146" cy="83" r="4" fill="#500472" opacity="0.25"/>
    </g>
</svg>

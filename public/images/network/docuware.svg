<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 96" role="img" aria-hidden="true">
    <!-- Flat drawing: filing cabinet with searched document — DMS/ECM -->
    <g>
        <!-- ground line -->
        <rect x="8" y="86" width="144" height="2" rx="1" fill="#e5e7eb"/>

        <!-- filing cabinet -->
        <rect x="46" y="18" width="42" height="68" rx="3" fill="#d1d5db"/>
        <rect x="52" y="26" width="30" height="14" rx="2" fill="#e5e7eb"/>
        <rect x="63" y="31" width="8" height="4" rx="2" fill="#ffffff"/>
        <rect x="52" y="46" width="30" height="14" rx="2" fill="#500472" opacity="0.65"/>
        <rect x="63" y="51" width="8" height="4" rx="2" fill="#ffffff"/>
        <rect x="52" y="66" width="30" height="14" rx="2" fill="#e5e7eb"/>
        <rect x="63" y="71" width="8" height="4" rx="2" fill="#ffffff"/>

        <!-- document pulled out -->
        <rect x="98" y="30" width="28" height="38" rx="3" fill="#e5e7eb"/>
        <rect x="103" y="37" width="18" height="3" rx="1.5" fill="#ffffff"/>
        <rect x="103" y="44" width="14" height="3" rx="1.5" fill="#ffffff"/>
        <rect x="103" y="51" width="18" height="3" rx="1.5" fill="#ffffff"/>

        <!-- magnifier -->
        <circle cx="124" cy="64" r="11" fill="none" stroke="#500472" stroke-width="4"/>
        <rect x="130" y="70" width="16" height="5" rx="2.5" fill="#500472" transform="rotate(45 130 70)"/>

        <!-- shrub accents -->
        <circle cx="18" cy="82" r="5" fill="#500472" opacity="0.35"/>
        <circle cx="146" cy="83" r="4" fill="#500472" opacity="0.25"/>
    </g>
</svg>

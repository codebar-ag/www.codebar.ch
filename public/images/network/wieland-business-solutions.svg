<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 96" role="img" aria-hidden="true">
    <!-- Flat drawing: document with two speech bubbles — DMS/ECM sparring partner -->
    <g>
        <!-- ground line -->
        <rect x="8" y="86" width="144" height="2" rx="1" fill="#e5e7eb"/>

        <!-- document sheet -->
        <rect x="40" y="24" width="46" height="62" rx="3" fill="#e5e7eb"/>
        <rect x="46" y="32" width="26" height="4" rx="2" fill="#ffffff"/>
        <rect x="46" y="42" width="34" height="4" rx="2" fill="#ffffff"/>
        <rect x="46" y="52" width="34" height="4" rx="2" fill="#ffffff"/>
        <rect x="46" y="62" width="30" height="4" rx="2" fill="#ffffff"/>
        <rect x="46" y="72" width="20" height="4" rx="2" fill="#500472" opacity="0.45"/>

        <!-- speech bubble back (gray) -->
        <rect x="92" y="22" width="40" height="24" rx="6" fill="#d1d5db"/>
        <path d="M100 46 L100 54 L110 46 Z" fill="#d1d5db"/>
        <rect x="98" y="29" width="22" height="3" rx="1.5" fill="#ffffff"/>
        <rect x="98" y="36" width="16" height="3" rx="1.5" fill="#ffffff"/>

        <!-- speech bubble front (brand) -->
        <rect x="104" y="52" width="40" height="22" rx="6" fill="#500472"/>
        <path d="M136 74 L136 82 L126 74 Z" fill="#500472"/>
        <rect x="111" y="58" width="20" height="3" rx="1.5" fill="#ffffff" opacity="0.85"/>
        <rect x="111" y="65" width="26" height="3" rx="1.5" fill="#ffffff" opacity="0.85"/>

        <!-- shrub accents -->
        <circle cx="18" cy="82" r="5" fill="#500472" opacity="0.35"/>
        <circle cx="150" cy="83" r="4" fill="#500472" opacity="0.25"/>
    </g>
</svg>

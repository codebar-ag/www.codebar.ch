<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" width="1600" height="840" fill="none" role="img" aria-labelledby="title-viewer-plugin">
    <title id="title-viewer-plugin">Der Datensatz ist in DocuWare gewählt, aber der Viewer bleibt leer, weil das Dokument in einem anderen System liegt; ein Plugin verbindet den DocuWare-Viewer damit und zeigt das Dokument dort an, wo sonst das DocuWare-Dokument erscheint</title>

    <defs>
        <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#C026D3"/>
            <stop offset="1" stop-color="#2563EB"/>
        </linearGradient>
        <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="1" stop-color="#f4eef8"/>
        </linearGradient>
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="42"/>
        </filter>
        <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1.8" fill="#09090b"/>
        </pattern>

        <path id="w1" d="M0 0c3.5-6 7.5-6 11 0s7.5 6 11 0"/>
        <path id="w2" d="M0 0c3.5-6 7.5-6 11 0s7.5 6 11 0s7.5-6 11 0s7.5 6 11 0"/>
        <path id="w3" d="M0 0c3.5-6 7.5-6 11 0s7.5 6 11 0s7.5-6 11 0s7.5 6 11 0s7.5-6 11 0s7.5 6 11 0"/>

        <path id="doc" d="M12 0h56l22 22v86a12 12 0 0 1-12 12H12A12 12 0 0 1 0 108V12A12 12 0 0 1 12 0Z"/>
        <path id="docfold" d="M68 0l22 22h-14a8 8 0 0 1-8-8Z"/>
        <path id="page" d="M16 0h108l46 46v128a16 16 0 0 1-16 16H16A16 16 0 0 1 0 174V16A16 16 0 0 1 16 0Z"/>
        <path id="pagefold" d="M124 0l46 46h-32a14 14 0 0 1-14-14Z"/>
    </defs>

    <rect width="1600" height="840" fill="url(#wash)"/>
    <rect x="0" y="0" width="300" height="840" fill="url(#dots)" opacity="0.1"/>
    <rect x="1300" y="0" width="300" height="840" fill="url(#dots)" opacity="0.1"/>

    <g transform="rotate(-4 340 420)">
        <rect x="116" y="266" width="320" height="290" rx="20" fill="#09090b" opacity="0.3"/>
        <rect x="100" y="250" width="320" height="290" rx="20" fill="#ffffff" stroke="#09090b" stroke-width="3" stroke-linejoin="round"/>
        <path d="M100 306H420" data-detail="viewer header rule" stroke="#09090b" stroke-width="3"/>
        <rect x="118" y="264" width="28" height="28" rx="8" fill="#09090b" opacity="0.45"/>
        <use href="#w3" x="162" y="282" stroke="#09090b" stroke-width="5" stroke-linecap="round"/>
        <g fill="#09090b" opacity="0.12">
            <rect x="116" y="324" width="100" height="28" rx="7"/>
            <rect x="116" y="400" width="100" height="28" rx="7"/>
            <rect x="116" y="438" width="100" height="28" rx="7"/>
            <rect x="116" y="476" width="100" height="28" rx="7"/>
        </g>
        <rect x="116" y="362" width="100" height="28" rx="7" fill="#09090b" opacity="0.2"/>
        <g stroke="#09090b" stroke-width="3.5" stroke-linecap="round" opacity="0.45">
            <use href="#w2" x="128" y="338"/>
            <use href="#w2" x="128" y="414"/>
            <use href="#w1" x="128" y="452"/>
            <use href="#w2" x="128" y="490"/>
        </g>
        <use href="#w2" x="128" y="376" stroke="#09090b" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
        <path d="M232 306V540" data-detail="viewer split rule" stroke="#09090b" stroke-width="2" opacity="0.12"/>
        <rect x="252" y="326" width="148" height="194" rx="10" data-detail="empty document well" stroke="#09090b" stroke-width="2.5" opacity="0.3" stroke-linejoin="round"/>
        <path d="M252 326l148 194" data-detail="empty document well" stroke="#09090b" stroke-width="2.5" opacity="0.3"/>
        <path d="M400 326L252 520" data-detail="empty document well" stroke="#09090b" stroke-width="2.5" opacity="0.3"/>

        <path d="M452 342v120a65 18 0 0 0 130 0V342a65 18 0 0 0-130 0Z" fill="#09090b" opacity="0.3"/>
        <path d="M440 330v120a65 18 0 0 0 130 0V330" fill="#ffffff" stroke="#09090b" stroke-width="3" stroke-linejoin="round"/>
        <ellipse cx="505" cy="330" rx="65" ry="18" fill="#ffffff" stroke="#09090b" stroke-width="3"/>
        <path d="M440 366a65 18 0 0 0 130 0" data-curve="cylinder fill line" data-detail="cylinder fill line" stroke="#09090b" stroke-width="2.5" opacity="0.4"/>
        <use href="#doc" x="516" y="414" fill="#09090b" opacity="0.3"/>
        <use href="#doc" x="506" y="404" fill="#ffffff" stroke="#09090b" stroke-width="3" stroke-linejoin="round"/>
        <use href="#docfold" x="506" y="404" fill="#ffffff" stroke="#09090b" stroke-width="3" stroke-linejoin="round"/>
        <g stroke="#09090b" stroke-width="3.5" stroke-linecap="round" opacity="0.45">
            <use href="#w2" x="522" y="446"/>
            <use href="#w1" x="522" y="474"/>
            <use href="#w2" x="522" y="502"/>
        </g>
    </g>

    <ellipse cx="780" cy="420" rx="118" ry="146" fill="url(#accent)" filter="url(#glow)" opacity="0.55"/>

    <g class="arrow" stroke="#09090b" stroke-width="4" fill="#09090b">
        <path d="M608 420h74" stroke-linecap="round"/>
        <path d="M700 420l-20-12v24Z" stroke="none"/>
        <path d="M850 420h72" stroke-linecap="round"/>
        <path d="M940 420l-20-12v24Z" stroke="none"/>
    </g>

    <rect x="714" y="366" width="124" height="124" rx="26" fill="#09090b" opacity="0.3"/>
    <rect x="706" y="358" width="124" height="124" rx="26" fill="#ffffff" stroke="#09090b" stroke-width="3"/>
    <g class="act" transform="translate(738 390)">
        <path d="M30 8L8 50H52Z" stroke="url(#accent)" stroke-width="5" fill="none" stroke-linejoin="round"/>
        <g fill="url(#accent)">
            <circle cx="30" cy="8" r="8"/><circle cx="8" cy="50" r="8"/><circle cx="52" cy="50" r="8"/>
        </g>
    </g>

    <rect x="982" y="202" width="380" height="340" rx="20" fill="#09090b" opacity="0.3"/>
    <rect x="964" y="184" width="392" height="352" rx="26" stroke="url(#accent)" stroke-width="3"/>
    <rect x="970" y="190" width="380" height="340" rx="20" fill="#ffffff" stroke="#09090b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M970 258h380" data-detail="viewer header rule" stroke="#09090b" stroke-width="3"/>
    <rect x="990" y="207" width="34" height="34" rx="10" fill="url(#accent)"/>
    <use href="#w3" x="1044" y="230" stroke="#09090b" stroke-width="5" stroke-linecap="round"/>

    <g fill="#09090b" opacity="0.12">
        <rect x="988" y="278" width="118" height="32" rx="8"/>
        <rect x="988" y="364" width="118" height="32" rx="8"/>
        <rect x="988" y="407" width="118" height="32" rx="8"/>
        <rect x="988" y="450" width="118" height="32" rx="8"/>
    </g>
    <rect x="988" y="321" width="118" height="32" rx="8" fill="url(#accent)" opacity="0.18"/>
    <g stroke="#09090b" stroke-width="3.5" stroke-linecap="round" opacity="0.45">
        <use href="#w2" x="1002" y="294"/>
        <use href="#w2" x="1002" y="380"/>
        <use href="#w1" x="1002" y="423"/>
        <use href="#w2" x="1002" y="466"/>
    </g>
    <use href="#w2" x="1002" y="337" stroke="#500472" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M1124 258V530" data-detail="viewer split rule" stroke="#09090b" stroke-width="2" opacity="0.12"/>

    <g fill="#09090b" opacity="0.12">
        <rect x="1146" y="274" width="26" height="26" rx="7"/>
        <rect x="1182" y="274" width="26" height="26" rx="7"/>
        <rect x="1218" y="274" width="26" height="26" rx="7"/>
        <rect x="1254" y="274" width="26" height="26" rx="7"/>
    </g>

    <use href="#page" x="1160" y="326" fill="#09090b" opacity="0.3"/>
    <use href="#page" x="1152" y="318" fill="#ffffff" stroke="#09090b" stroke-width="2.5" stroke-linejoin="round"/>
    <use href="#pagefold" x="1152" y="318" fill="#ffffff" stroke="#09090b" stroke-width="2.5" stroke-linejoin="round"/>
    <use href="#w2" x="1174" y="366" stroke="#09090b" stroke-width="5.5" stroke-linecap="round"/>
    <g stroke="#09090b" stroke-width="4.5" stroke-linecap="round">
        <use href="#w3" x="1174" y="400"/><use href="#w1" x="1254" y="400"/>
        <use href="#w2" x="1174" y="430"/><use href="#w2" x="1232" y="430"/>
        <use href="#w3" x="1174" y="460"/>
    </g>

    <path d="M1384 402h14M1384 424h14" data-detail="plugin pins" stroke="#09090b" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
    <rect x="1330" y="391" width="44" height="44" rx="10" fill="url(#accent)"/>
</svg>
